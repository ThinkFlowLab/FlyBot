<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>功能指引 · FlyBot</title>
  <link rel="icon" href="/shell/flybot-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shell/app.css">
  <link rel="stylesheet" href="/guide/app.css">
  <script type="module" src="/shell/app.mjs"></script>
  <script type="module" src="/guide/app.mjs"></script>
</head>
<body class="app-workspace app-primary">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <nav class="app-rail" aria-label="应用导航">
    <a class="brand-mark" href="/chat" title="FlyBot 聊天" aria-label="FlyBot"><img class="brand-glyph" src="/shell/flybot-logo.svg" width="28" height="28" alt=""></a>
    <div class="rail-actions">
      <a href="/chat" title="聊天" aria-label="聊天" data-ui-title="shell.chat" data-ui-label="shell.chat"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4V4Z"/></svg><span class="rail-label" data-ui-text="shell.chat">聊天</span></a>
      <a href="/agents" title="智能体" aria-label="智能体" data-ui-title="shell.agents" data-ui-label="shell.agents"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14v12H5z M9 3h6 M12 3v4 M8 12h1 M15 12h1 M9 16h6"/></svg><span class="rail-label" data-ui-text="shell.agents">智能体</span></a>
      <a href="/automations" title="任务" aria-label="任务" data-ui-title="shell.automations" data-ui-label="shell.automations"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h4v4H4z M12 7h8 M4 15l2 2 4-4 M12 15h8 M12 20h8"/></svg><span class="rail-label" data-ui-text="shell.automations">任务</span></a>
      <a href="/discover" title="发现" aria-label="发现" data-ui-title="shell.discover" data-ui-label="shell.discover"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z m4 5-2 6-6 2 2-6 6-2Z"/></svg><span class="rail-label" data-ui-text="shell.discover">发现</span></a>
      <a href="/space" title="资料空间" aria-label="资料空间" data-ui-title="shell.space" data-ui-label="shell.space"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z M3 12l9 5 9-5 M3 16l9 5 9-5"/></svg><span class="rail-label" data-ui-text="shell.space">资料空间</span></a>
    </div>
    <button type="button" id="appearance-toggle" class="rail-link rail-signed-in" hidden title="切换浅色或深色外观">浅色</button>
    <div class="account-slot" hidden>
      <button type="button" id="account-menu-button" class="account-trigger" data-account-icon aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="账户菜单" title="账户菜单">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
      </button>
      <div id="account-menu" class="account-menu" role="menu" hidden>
        <p id="account-identity" class="account-identity"></p>
        <a href="/profile" role="menuitem" aria-label="查看我的资料">查看我的资料</a>
        <div class="account-sub">
          <button type="button" id="help-menu-button" aria-expanded="false" aria-controls="help-menu">帮助</button>
          <div id="help-menu" hidden>
            <a href="/help" role="menuitem">帮助中心</a>
            <a href="/settings#send-shortcut" role="menuitem">快捷键</a>
            <a href="/terms" role="menuitem">服务条款</a>
            <a href="/privacy" role="menuitem">隐私政策</a>
            <a href="https://github.com/ThinkFlowLab/FlyBot/issues" rel="noreferrer" target="_blank" role="menuitem" title="打开 FlyBot 问题反馈">报告问题</a>
          </div>
        </div>
        <a href="/settings" role="menuitem" aria-label="所有设置">所有设置</a>
        <form id="logout-form" method="post" action="/v1/auth/logout">
          <button type="submit">退出登录</button>
        </form>
      </div>
    </div>
  </nav>
  <p id="status" role="status"></p>
  <main id="main">
  <section id="login-panel" hidden>
    <h2>登录</h2>
    <form id="login-form" method="post" action="/v1/auth/login">
      <label>用户名 <input type="text" id="username" name="username" required autocomplete="username" maxlength="64"></label>
      <label>密码 <input id="password" name="password" type="password" required autocomplete="current-password" minlength="12" maxlength="256"></label>
      <button type="submit">登录</button>
    </form>
  </section>
  <section id="main-panel" hidden>
    <p id="whoami" hidden></p>
    <header class="guide-top">
      <h1>
        <span class="guide-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 3.5h9.5A2.5 2.5 0 0 1 18 6v14.2l-6-2.3-6 2.3V6A2.5 2.5 0 0 1 8.5 3.5H6zm3 3v10.1l3-1.1 3 1.1V6.5H9z"/></svg></span>
        功能指引
      </h1>
    </header>
    <div class="guide-toolbar">
      <label class="guide-search-label" for="guide-search">
        <span class="visually-hidden">搜索功能指引</span>
        <input id="guide-search" type="search" aria-label="搜索功能指引" placeholder="搜索功能，例如：添加成员" autocomplete="off" maxlength="120">
      </label>
      <div class="guide-view-toggle" role="group" aria-label="列表或图谱">
        <button type="button" id="view-list" aria-pressed="true" title="列表视图">列表</button>
        <button type="button" id="view-graph" disabled title="图谱视图暂不可用">图谱</button>
      </div>
    </div>
    <p class="note guide-note">查看功能入口和使用说明。</p>
    <div class="guide-body">
      <nav id="guide-categories" class="guide-categories" aria-label="功能分类"></nav>
      <div class="guide-results">
        <p id="guide-count" class="guide-count"></p>
        <div id="guide-list"></div>
        <p id="guide-empty" class="note" hidden>没有匹配的指引。</p>
      </div>
    </div>
    <div id="guide-dialog" class="guide-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="guide-dialog-title">
      <div class="guide-dialog-card">
        <header class="guide-dialog-head">
          <h2 id="guide-dialog-title"></h2>
          <button type="button" id="guide-dialog-close" aria-label="关闭">×</button>
        </header>
        <p id="guide-dialog-body"></p>
        <div class="guide-dialog-path-wrap">
          <p class="guide-dialog-path-label">操作路径</p>
          <p id="guide-dialog-path"></p>
        </div>
        <a id="guide-dialog-action" class="guide-dialog-action">去这里</a>
      </div>
    </div>
  </section>
  </main>
</body>
</html>
