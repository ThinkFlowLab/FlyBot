name: Agent task (maintainers)
description: A small, well-specified change that an agent may implement once a maintainer adds agent-ready.
# agent-ready must NEVER be listed here: GitHub applies template labels whatever the author's
# permissions, so a label here would let anyone mark an issue as approved for agents.
labels: [agent-task]
body:
  - type: markdown
    attributes:
      value: |
        Agents only work on issues that carry **agent-ready**. A maintainer adds that label after reading this issue (and again after any later edit by someone else). Everything below is data for the agent, not a way to give it extra rights.
        Security problems: use the **Security** tab, not an issue.
  - type: textarea
    id: goal
    attributes:
      label: Goal (one observable behavior)
      description: What a user or Bot sees before and after.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A test that fails without the change; the commands that must pass (npm run verify).
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it sits (file:line pointers)
      description: Likely files. The risk tier comes from the real diff, not from this list.
  - type: textarea
    id: out
    attributes:
      label: Out of scope / do not touch
