name: FlyBot tests
description: >-
  Node, npm ci, the DSH harness, lint, the client bundle check and core's (ds-bot) suite
  (optionally as a coverage run), plus the peer plugin suites under plugins/ unless
  plugins is 'false'. Test (the PR gate) runs core here and each plugin in its own
  `plugins (<name>)` job; the Compatibility legs (nightly.yml) can use it for everything.
inputs:
  node:
    description: Node.js version
    required: true
  dsh:
    description: DSH (@deepseek-ai/dsh) version for the harness
    required: true
  coverage:
    description: "'true': run all suites in one coverage run and upload lcov"
    required: false
    default: 'false'
  plugins:
    description: "'false': core only (the plugins/* suites run elsewhere)"
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: ${{ inputs.node }}
        cache: npm
        cache-dependency-path: core/package-lock.json
    # The job-level timeout-minutes bounds a stuck registry (composite steps take none).
    - name: npm ci
      shell: bash
      working-directory: core
      run: npm ci --no-fund --no-audit
    - name: Install DSH
      shell: bash
      working-directory: core
      env:
        DSH: ${{ inputs.dsh }}
      run: npm run harness -- --no-save "@deepseek-ai/dsh@$DSH"
    - name: Fetch origin/main for arch-docs check
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
        for n in 50 200 1000 5000; do
          if git merge-base origin/main HEAD >/dev/null 2>&1; then
            break
          fi
          git fetch --no-tags --deepen="$n" origin main 2>/dev/null || true
          git fetch --no-tags --deepen="$n" origin HEAD 2>/dev/null || true
        done
        if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
          git fetch --unshallow 2>/dev/null || git fetch --no-tags origin main
        fi
        git merge-base origin/main HEAD >/dev/null
        git rev-parse --verify origin/main^{commit}
    # Lint and the bundle check first: a slip fails in seconds instead of after the suite.
    - name: Lint
      shell: bash
      working-directory: core
      run: npm run lint
    - name: Build (client bundle is up to date)
      shell: bash
      working-directory: core
      run: node scripts/build-client.mjs --check
    # Core's suite (incl. bot-tree: the public flybot.sidebar.structure slot), then each peer
    # plugin's own suite and lint (plugins/social, plugins/tree; each also tests against core/).
    - name: Unit tests
      if: inputs.coverage != 'true'
      shell: bash
      working-directory: core
      run: npm test
    - name: Plugin lint
      if: inputs.plugins != 'false'
      shell: bash
      run: node scripts/lint-plugins.mjs
    - name: Plugin tests (social)
      if: inputs.plugins != 'false'
      shell: bash
      working-directory: plugins/social
      env:
        DSH_HARNESS: ${{ github.workspace }}/core/dev/harness
      run: npm test
    - name: Plugin tests (tree)
      if: inputs.plugins != 'false'
      shell: bash
      working-directory: plugins/tree
      env:
        DSH_HARNESS: ${{ github.workspace }}/core/dev/harness
      run: npm test
    # Core's suite as a coverage run (each plugin runs its own suite).
    - name: Unit tests with coverage
      if: inputs.coverage == 'true'
      shell: bash
      working-directory: core
      env:
        NODE_V: ${{ inputs.node }}
        DSH: ${{ inputs.dsh }}
      run: |
        set -o pipefail
        node --import ./test/harness-resolve.mjs --test --experimental-test-coverage \
          --test-reporter=spec --test-reporter-destination=stdout \
          --test-reporter=lcov --test-reporter-destination=lcov.info \
          "test/*.test.js" | tee test-output.txt
        {
          echo "### Coverage: core (ds-bot) (Node $NODE_V, DSH $DSH)"
          echo '```'
          grep -E 'file +\| line %|all files' test-output.txt | sed 's/^ℹ //' | head -2
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage
      if: always() && inputs.coverage == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: coverage-lcov
        path: core/lcov.info
        if-no-files-found: ignore
        retention-days: 14
