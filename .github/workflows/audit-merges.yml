# The patrol for #697: once a day, on the default branch only, it lists what reached `main` without
# passing the queue, so a bypass is found by a machine instead of by whoever happens to look.
#
# Both of its events require the file to be on the default branch already — `schedule` runs the
# default branch's copy, and `workflow_dispatch` can only be asked for a workflow that exists there.
# So this file has no check on a pull request at all: it is not pending there, it is absent. That is
# also why it must never be a required check: on a pull request it would wait forever.
name: Audit merges

on:
  workflow_dispatch:
  schedule:
    # 03:41 UTC, a slack hour after the nightly image builds.
    - cron: '41 3 * * *'

concurrency:
  group: audit-merges
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  audit:
    name: audit-merges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a45a0492352c231440313e0bb78992b9d4 # v6.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The watermark is the last green run of this same workflow: a check that is red over
      # the whole history is a check nobody reads, so only findings after it fail the run.
      - name: Take the last green run of this workflow as the watermark
        id: watermark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This filename can still resolve to a deleted workflow of the same name (id 392609103, 36
          # runs, last success head bab1fe96 on 2026-11-24): then the first run here is not an empty
          # watermark, and its log opens with `audit-merges: watermark … (from …)` rather than
          # `audit-merges: baseline run`. Only the first line of the first scheduled run tells which.
          SINCE=$(gh api "repos/$GH_REPO/actions/workflows/audit-merges.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
      - name: Audit the last merges on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SINCE: ${{ steps.watermark.outputs.since }}
          GATE_PATH: .github/workflows/tests.yml
          GATE_NAME: FlyBot required checks
        run: |
          set -euo pipefail
          if [ -n "$SINCE" ]; then
            node .github/scripts/audit-merges.mjs --repo "$GH_REPO" --since "$SINCE"
          else
            node .github/scripts/audit-merges.mjs --repo "$GH_REPO" --baseline
          fi
      # Report, never block a merge: the pull request checks are the gate. A finding makes this run
      # red so the watermark cannot move past it — the next run would otherwise sign it off as
      # `earlier` and nobody would see it again.
