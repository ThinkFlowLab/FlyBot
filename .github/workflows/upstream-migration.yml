name: Upstream migration checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify imported file hashes, licenses, and exclusions
        run: python3 scripts/verify-upstream-migration.py
      - name: Provenance unit tests
        run: python3 -m unittest tests.test_upstream_migration -v
  bot-social-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/bot-social/package-lock.json
      - name: Install Bot Social lockfile dependencies
        working-directory: services/bot-social
        run: npm ci --no-fund --no-audit
      - name: Run Bot Social source tests (no real tokens)
        working-directory: services/bot-social
        run: npm test
        env:
          CI: true
  flybot-social-plugin-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run @flybot/social plugin-only tests (no DSH, no core, no npm ci)
        working-directory: runtime/flybot/plugins/social
        run: npm test
        env:
          CI: true
