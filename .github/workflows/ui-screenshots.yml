name: UI screenshots
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Bot Social dependencies
        run: npm ci --prefix services/bot-social
      - name: Install Playwright on the runner only
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p ot-playwright
          cd ot-playwright
          npm init -y >/dev/null
          npm install playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Exercise the native FlyBot pages in Chromium
        run: |
          set -eu
          # Playwright is resolved next to the browser runner script.
          ln -sfn "$RUNNER_TEMP/ot-playwright/node_modules" "$GITHUB_WORKSPACE/node_modules"
          node --import ./services/bot-social/node_modules/tsx/dist/loader.mjs \
            scripts/ci-native-ui-screenshots.mjs "$GITHUB_WORKSPACE/ui-screenshots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flybot-workspace-ui-screenshots
          path: ui-screenshots
          if-no-files-found: error
          retention-days: 30
