# FlyBot, one instance per person (#352). Guide: docs/docker.md (中文: docs/docker.zh.md).
#   docker compose up -d --build                 build this checkout and start
#   docker compose logs flybot | grep token=     the sign-in link
# More instances on one machine: a project name and a port each, for example
#   FLYBOT_PORT=3081 docker compose -p alice up -d --build
services:
  flybot:
    build: .
    image: flybot:${FLYBOT_TAG:-local}
    restart: unless-stopped
    # Host networking, and the server binds the host's 127.0.0.1 only (docker/web.patch.yml):
    # DSH 0.2.1 refuses a wildcard bind, and with host networking the port is still the host's
    # loopback instead of a published one. For remote access use your own HTTPS proxy or an SSH
    # tunnel; never expose this port on a public address. Linux Docker only: Docker Desktop does
    # not route host networking to the host.
    network_mode: host
    environment:
      # Passed only when set in your shell or in .env next to this file; otherwise save the
      # key in the app (it is kept on the data volume).
      - DEEPSEEK_API_KEY
      # The port the server binds on the host loopback; the entry point defaults to 3080.
      - FLYBOT_PORT
    volumes:
      - data:/data
volumes:
  data:
